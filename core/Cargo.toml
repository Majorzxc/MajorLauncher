[package]
name = "majorlauncher-core"
description = "Ядро MajorLauncher: версии, загрузки, запуск, моды, сборки. Без интерфейса"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
keyring-core = "1.0.0"
md-5 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json", "native-tls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "io-util"] }
tracing = "0.1.44"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["net", "io-util", "macros", "rt-multi-thread"] }

[target."cfg(windows)".dependencies]
windows-native-keyring-store = "1.1.0"
