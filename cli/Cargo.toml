[package]
name = "majorlauncher-cli"
description = "Консольная утилита поверх ядра MajorLauncher: тесты и автоматизация"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mlcli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
majorlauncher-core = { path = "../core" }
rpassword = "7.5.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
