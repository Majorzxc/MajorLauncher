name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Фронтенд — зависимости
        working-directory: app
        run: npm ci

      - name: Фронтенд — проверка типов
        working-directory: app
        run: npm run check

      # Окно встраивает собранный фронтенд при компиляции, поэтому он нужен раньше Rust.
      - name: Фронтенд — сборка
        working-directory: app
        run: npm run build

      - name: Rust — форматирование
        run: cargo fmt --all --check

      - name: Rust — clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust — тесты
        run: cargo test --workspace
